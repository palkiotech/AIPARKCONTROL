name = "aiparkcontrol"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["0 13 */3 * *"]   # cada 3 días, 8:00 a. m. hora Colombia

[observability]
enabled = true
